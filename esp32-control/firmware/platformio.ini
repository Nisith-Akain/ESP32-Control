; PlatformIO project file for EC-1: ESP32 core firmware (WiFi + MQTT +
; telemetry + command handling). See TEAM/INTERFACES.md for the wire
; contracts this firmware implements, and README.md in this directory for
; build/config instructions.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    ; PubSubClient's default packet buffer (256B) is tight once a JSON
    ; command_result/telemetry payload grows past a couple of fields; bump it.
    -D MQTT_MAX_PACKET_SIZE=512
